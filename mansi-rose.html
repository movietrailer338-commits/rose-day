<!DOCTYPE html>
<html>
<head>
<title>For Mansi ❤️</title>

<style>
body{
margin:0;
font-family:'Segoe UI';
background:black;
color:white;
text-align:center;
overflow:hidden;
}

#startScreen{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(45deg,#ff4e8a,#ff6ec7);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:10;
}

button{
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
background:white;
color:#ff4e8a;
cursor:pointer;
box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.container{
display:none;
padding-top:40px;
}

img{
width:240px;
height:240px;
border-radius:50%;
border:6px solid white;
box-shadow:0 0 30px pink;
animation: glow 2s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 15px pink;}
to{box-shadow:0 0 45px red;}
}

h1{
font-size:45px;
color:#ff6ec7;
}

p{
font-size:21px;
padding:0 25px;
line-height:32px;
}

.heart{
position:absolute;
color:red;
font-size:26px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

#typing{
border-right:3px solid white;
display:inline;
padding-right:5px;
font-size:22px;
}
</style>
</head>

<body>

<div id="startScreen">
<h1>🌹 A Special Rose Day Surprise For Mansi 🌹</h1>
<button onclick="startLove()">Open Your Surprise</button>
</div>

<audio id="music" loop>
<source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<div class="container" id="main">

<h1>Happy Rose Day 🌹❤️</h1>

<img src="https://i.ibb.co/0jYqpXdJ/Screenshot-20240321-225658-1.jpg">

<h2>Dear Mansi 💖</h2>

<p id="typing"></p>

<h1 id="loveText" style="display:none;">I LOVE YOU MANSI ❤️</h1>

</div>

<script>

function startLove(){
document.getElementById("startScreen").style.display="none";
document.getElementById("main").style.display="block";
document.getElementById("music").play();
typeMessage();
createHearts();
}

let message="🌹 Happy Rose Day My Love 🌹\n\nEvery rose is a symbol of my love for you... Your smile is more beautiful than any flower in this world. You make my life brighter, happier and more meaningful. I promise to always care for you, support you and love you forever. 💖";

let i=0;
function typeMessage(){
if(i<message.length){
document.getElementById("typing").innerHTML+=message.charAt(i);
i++;
setTimeout(typeMessage,45);
}else{
document.getElementById("loveText").style.display="block";
}
}

function createHearts(){
for(let i=0;i<70;i++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(3+Math.random()*5)+"s";
document.body.appendChild(heart);
}
}

</script>

</body>
</html>
